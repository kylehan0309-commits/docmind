name: docmind

services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the backend reaches Ollama by service name,
      # not localhost. Override in .env to point at a host Ollama instead.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      - docmind-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Optional local model runner. Off by default (cloud providers need no
  # container). Turn on with:  docker compose --profile local up
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  docmind-data:
  ollama-models:
