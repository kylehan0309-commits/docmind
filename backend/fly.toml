# Fly.io app config for the DocMind API. Deploy from backend/:
#   fly deploy --config fly.toml --dockerfile Dockerfile
# App name must be globally unique on Fly - change it here (and in
# frontend/fly.toml's BACKEND_HOST) if "docmind-api" is taken.
app = "docmind-api"
primary_region = "iad"

[build]

[env]
  DATABASE_URL = "sqlite+aiosqlite:////data/docmind.db"
  UPLOAD_DIR = "/data/uploads"
  LLM_PROVIDER = "gemini"   # no Ollama in the cloud - CPU inference is impractically slow
  SEED_DEMO = "true"

# Persistent disk for the SQLite DB + uploaded PDFs, survives deploys/restarts.
[[mounts]]
  source = "docmind_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"   # sentence-transformers + torch resident set needs more than the 256mb default

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1   # keep warm - no cold start before the chat/graph calls it makes

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"
